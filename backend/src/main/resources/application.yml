spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/anook_db}
    username: ${SPRING_DATASOURCE_USERNAME:anook_user}
    password: ${SPRING_DATASOURCE_PASSWORD:anook2026}
    driver-class-name: org.postgresql.Driver

  sql:
    init:
      mode: always                # schema.sql, data.sql 항상 실행
      continue-on-error: true     # 이미 존재하는 제약/인덱스 등 idempotent 에러 무시 (PostgreSQL DO $$ 블록 파싱 한계 우회)

  data:
    redis:
      host: ${SPRING_REDIS_HOST:localhost}
      port: ${SPRING_REDIS_PORT:6379}

  jpa:
    defer-datasource-initialization: true   # SQL 스크립트를 Hibernate 초기화 이후 실행
    hibernate:
      ddl-auto: none              # SQL 스크립트로 스키마 관리 (Hibernate 자동 DDL 비활성화)
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:default-local-secret-key-for-anook-1234567890}
  expiration-time: 86400000 # 24 hours in ms # 24 hours in ms

# 포트폴리오 데모 계정 설정
anook:
  demo:
    # JTI(중복 로그인) 검사를 면제할 직원 PIN 목록 (쉼표 구분)
    # 데모 계정은 여러 방문자가 동시에 사용해야 하므로 단일 세션 강제에서 제외한다.
    # 운영 전환 시 빈 값(DEMO_STAFF_PINS=)으로 두면 기능이 완전히 비활성화된다.
    staff-pins: ${DEMO_STAFF_PINS:999999}

server:
  port: 8080

# AI 서비스 (Python FastAPI)
ai:
  service:
    enabled: true  # AI 서버 완성 후 true로 변경 → PythonAiHttpAdapter 활성화
    url: ${AI_SERVER_URL:http://localhost:8000}

# 객실 일일 제한 물품 정책 설정 (단일 호텔 전용)
inventory:
  policies:
    - code: WATER
      aliases:
        - "생수"
        - "물"
        - "워터"
        - "water"
        - "お水"
        - "水"
        - "ウォーター"
      allowance: 2
      extra-charge: 2000
    - code: TOWEL
      aliases:
        - "수건"
        - "타월"
        - "towel"
        - "タオル"
        - "毛巾"
      allowance: 4
      extra-charge: 1000

# 한국수출입은행 환율 API (PMS 빌링 KRW → USD 변환)
koreaexim:
  base-url: https://oapi.koreaexim.go.kr
  auth-key: ${KOREAEXIM_AUTH_KEY:}

